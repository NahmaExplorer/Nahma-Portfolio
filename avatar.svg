<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1840"/>
      <stop offset="60%" stop-color="#060c20"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#cyberBgGrad)" rx="24"/>
  
  <!-- Cyber Grid Lines -->
  <g stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="420" y1="0" x2="420" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="420" x2="600" y2="420"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
  </g>

  <!-- Core Ambient Glow -->
  <circle cx="300" cy="300" r="210" fill="url(#coreGlow)"/>

  <!-- Orbital Rings -->
  <circle cx="300" cy="300" r="235" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-dasharray="12 18" stroke-width="2"/>
  <circle cx="300" cy="300" r="195" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-dasharray="8 12" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="155" fill="none" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Orbital Nodes -->
  <circle cx="300" cy="65" r="6" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="485" cy="215" r="5" fill="#a855f7" filter="url(#neonGlow)"/>
  <circle cx="410" cy="455" r="6" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="160" cy="410" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="115" cy="215" r="7" fill="#c084fc" filter="url(#neonGlow)"/>

  <!-- Central Hexagonal Shield -->
  <polygon points="300,175 390,225 390,335 300,385 210,335 210,225" 
           fill="rgba(8, 16, 42, 0.85)" 
           stroke="url(#neonCyanPurple)" 
           stroke-width="3" 
           filter="url(#neonGlow)"/>

  <!-- NF Monogram -->
  <text x="300" y="315" 
        font-family="'Orbitron', 'Space Grotesk', sans-serif" 
        font-size="68" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="4" 
        filter="url(#neonGlow)">NF</text>

  <!-- Subtitle -->
  <text x="300" y="354" 
        font-family="'JetBrains Mono', monospace" 
        font-size="12" 
        font-weight="700" 
        fill="#00f0ff" 
        text-anchor="middle" 
        letter-spacing="4">NAHMA FATHIMA</text>

  <text x="300" y="425" 
        font-family="'Space Grotesk', sans-serif" 
        font-size="13" 
        fill="#94a3b8" 
        text-anchor="middle">Computer Science &bull; AI Specialisation &bull; NIAT</text>
</svg>