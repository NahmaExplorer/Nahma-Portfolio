<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dsdBgCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04091a"/>
      <stop offset="60%" stop-color="#0b1739"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="dsdGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#dsdBgCyber)" rx="16"/>

  <!-- Cyber Grid -->
  <g stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Top bar -->
  <rect x="50" y="35" width="700" height="42" rx="8" fill="rgba(14, 25, 58, 0.75)" stroke="#00f0ff" stroke-opacity="0.3"/>
  <circle cx="75" cy="56" r="5" fill="#ef4444"/>
  <circle cx="95" cy="56" r="5" fill="#eab308"/>
  <circle cx="115" cy="56" r="5" fill="#22c55e"/>
  <text x="400" y="61" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">digitalsecondbrain.lovable.app // NIAT Bootcamp Concept</text>

  <!-- Central Vault & Second Brain Graphic -->
  <circle cx="400" cy="215" r="85" fill="rgba(12, 26, 62, 0.7)" stroke="url(#cyanPurpleGrad)" stroke-width="3" filter="url(#dsdGlow)"/>
  <circle cx="400" cy="215" r="115" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-dasharray="8 10"/>

  <!-- Brain / Memory Vault Icon -->
  <path d="M 370,190 Q 360,175 345,185 Q 330,200 345,220 Q 335,240 350,255 Q 370,265 380,245 L 380,190 Z" fill="rgba(0, 240, 255, 0.25)" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 430,190 Q 440,175 455,185 Q 470,200 455,220 Q 465,240 450,255 Q 430,265 420,245 L 420,190 Z" fill="rgba(168, 85, 247, 0.25)" stroke="#a855f7" stroke-width="2"/>
  <line x1="400" y1="180" x2="400" y2="250" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Knowledge Node Cards -->
  <rect x="75" y="150" width="185" height="80" rx="10" fill="rgba(9, 20, 50, 0.8)" stroke="#00f0ff" stroke-opacity="0.35"/>
  <text x="95" y="180" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700">MEMORY VAULT</text>
  <text x="95" y="205" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Save &amp; Centralize Ideas</text>

  <rect x="540" y="150" width="185" height="80" rx="10" fill="rgba(9, 20, 50, 0.8)" stroke="#a855f7" stroke-opacity="0.35"/>
  <text x="560" y="180" fill="#c084fc" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700">SMART RETRIEVAL</text>
  <text x="560" y="205" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Rapid Recall &amp; Search</text>

  <!-- Connectors -->
  <path d="M 260,190 L 315,215" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 540,190 L 485,215" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Title & Tagline -->
  <text x="400" y="355" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" text-anchor="middle">Digital Second Brain (DSD)</text>
  
  <text x="400" y="388" fill="#00f0ff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="500" text-anchor="middle">"Forget Less. Learn Faster. Live Smarter."</text>
  
  <rect x="250" y="410" width="300" height="34" rx="17" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-opacity="0.4"/>
  <text x="400" y="432" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">FIRST TECH PROJECT &bull; NIAT BOOTCAMP</text>
</svg>